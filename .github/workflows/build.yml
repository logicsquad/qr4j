name: build
on: [push]
jobs:
  build:
    # The Windows entry is deliberate: QR4J's toSvg() documents that it always emits Unix
    # newlines regardless of platform, and the only way that contract can break is on a
    # platform where line.separator is not "\n".
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '11', '17', '21']
        include:
          - os: windows-latest
            java: '17'
          - os: macos-latest
            java: '17'

    name: ${{ matrix.os }} / JDK ${{ matrix.java }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
